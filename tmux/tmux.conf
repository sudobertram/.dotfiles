# Базовые настройки
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl+a вместо Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Перезагрузка конфига
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Разделение окон (более логично)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Навигация между панелями (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Создание окна в текущей директории
bind c new-window -c "#{pane_current_path}"

# Копирование (vim-style)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Статус-бар (Nord theme)
set -g status-style bg=#2e3440,fg=#d8dee9
set -g status-left "#[fg=#88c0d0,bold] #S #[fg=#d8dee9]│ "
set -g status-right "#[fg=#d8dee9]%H:%M #[fg=#88c0d0]│#[fg=#d8dee9] %d %b "
set -g window-status-format "#[fg=#4c566a] #I:#W "
set -g window-status-current-format "#[fg=#88c0d0,bold] #I:#W "
set -g pane-border-style fg=#3b4252
set -g pane-active-border-style fg=#88c0d0
